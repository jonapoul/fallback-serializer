name: Publish

on:
  # snapshots: after CI passes on main
  workflow_run:
    workflows: [ "CI" ]
    types: [ completed ]
  # releases: on a tag
  push:
    tags: [ "**" ]

env:
  CI: true
  GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: read

concurrency:
  # separate groups, so a queued snapshot run can't cancel a pending release run
  group: ${{ github.event_name == 'push' && format('publish-{0}', github.ref) || 'publish-snapshot' }}
  cancel-in-progress: false

jobs:
  check-version:
    if: ${{ github.repository == 'jonapoul/fallback-serializer' && (github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.version.outputs.sha }}
      version: ${{ steps.version.outputs.value }}
      is-snapshot: ${{ steps.version.outputs.is-snapshot }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Verify tag is on main
        if: github.event_name == 'push'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${{ github.ref_name }} ($GITHUB_SHA) is not on main"
            exit 1
          fi

      - name: Get Gradle version
        id: version
        run: |
          GRADLE_VERSION="$(grep -E '^VERSION_NAME=' gradle.properties | cut -d "=" -f 2)"
          echo "GRADLE_VERSION=$GRADLE_VERSION"
          if [ -z "$GRADLE_VERSION" ]; then
            echo "::error::No VERSION_NAME in gradle.properties"
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "value=$GRADLE_VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GRADLE_VERSION" == *"-SNAPSHOT"* ]]; then
            echo "is-snapshot=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-snapshot=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Git tag matches Gradle version
        if: github.event_name == 'push'
        env:
          GRADLE_VERSION: ${{ steps.version.outputs.value }}
          GIT_TAG: ${{ github.ref_name }}
        run: |
          echo "GIT_TAG=$GIT_TAG"
          if [[ "$GRADLE_VERSION" == *"-SNAPSHOT"* ]]; then
            echo "::error::Can't release a snapshot ($GRADLE_VERSION), tagged as $GIT_TAG"
            exit 1
          elif [ "$GRADLE_VERSION" != "$GIT_TAG" ]; then
            echo "::error::Gradle version = $GRADLE_VERSION, Git tag = $GIT_TAG => MISMATCH!"
            exit 1
          fi

      - name: Report nothing to publish
        if: ${{ github.event_name != 'push' && steps.version.outputs.is-snapshot == 'false' }}
        env:
          GRADLE_VERSION: ${{ steps.version.outputs.value }}
        run: echo "::notice::$GRADLE_VERSION is not a snapshot, nothing to publish. Push a tag to release it."

  publish-snapshot:
    # macOS: the runtime's Apple targets can only be compiled on a macOS host
    runs-on: macos-latest
    timeout-minutes: 60
    needs: check-version
    if: ${{ github.event_name == 'workflow_run' && needs.check-version.outputs.is-snapshot == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check-version.outputs.sha }}
      - uses: ./.github/actions/setup-java
      - uses: ./.github/actions/setup-gradle

      - name: Publish snapshot
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_KEY_PASSWORD }}
        run: ./gradlew publishToMavenCentral

  publish-release:
    # macOS: the runtime's Apple targets can only be compiled on a macOS host
    runs-on: macos-latest
    timeout-minutes: 60
    needs: check-version
    if: ${{ github.event_name == 'push' && needs.check-version.outputs.is-snapshot == 'false' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-java
      - uses: ./.github/actions/setup-gradle

      - name: Publish
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_KEY_PASSWORD }}
        run: ./gradlew publishToMavenCentral

      - name: Create release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          generateReleaseNotes: true
          name: v${{ needs.check-version.outputs.version }}

  release-notes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [ check-version, publish-release ]
    permissions:
      contents: write
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # a failure keeps GitHub's generated notes
      - uses: anthropics/claude-code-action@3b8197d3d486006dd4af54613517f21ac6ac625e # v1.0.227
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            TAG: ${{ github.ref_name }}

            Rewrite the GitHub release notes for TAG. They currently hold GitHub's generated list of PRs.

            1. Find the previous tag with `git describe --tags --abbrev=0 TAG^`.
            2. Read the PRs merged between the two tags (`git log`, `gh pr view`, linked issues) and the
               source diff, ignoring tests and CI.
            3. Match the style of earlier releases (`gh release view <tag>`): short sections such as
               "Breaking change", "What's new", "Fixes", "Checks", "Compatibility" and "Testing", only
               where they apply. Focus on what users of the plugin notice. Reference PR and issue numbers.
               Keep the "**Full Changelog**" link at the end.
            4. Save the notes with `gh release edit TAG --notes-file <file>`.

            Use minimal, simple, natural language. Don't use em-dashes. Use README.md and CLAUDE.md for context.
          claude_args: '--allowed-tools "Read,Write,Grep,Glob,Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git describe:*),Bash(git tag:*),Bash(gh pr view:*),Bash(gh issue view:*),Bash(gh release view:*),Bash(gh release edit:*)"'

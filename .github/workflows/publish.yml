name: Publish

on:
  # snapshots: after CI passes on main
  workflow_run:
    workflows: [ "CI" ]
    types: [ completed ]
  # releases: on a tag
  push:
    tags: [ "**" ]

env:
  CI: true
  GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: read

concurrency:
  # separate groups, so a queued snapshot run can't cancel a pending release run
  group: ${{ github.event_name == 'push' && format('publish-{0}', github.ref) || 'publish-snapshot' }}
  cancel-in-progress: false

jobs:
  check-version:
    if: ${{ github.repository == 'jonapoul/fallback-serializer' && (github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.version.outputs.sha }}
      version: ${{ steps.version.outputs.value }}
      is-snapshot: ${{ steps.version.outputs.is-snapshot }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Verify tag is on main
        if: github.event_name == 'push'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${{ github.ref_name }} ($GITHUB_SHA) is not on main"
            exit 1
          fi

      - name: Get Gradle version
        id: version
        run: |
          GRADLE_VERSION="$(grep -E '^VERSION_NAME=' gradle.properties | cut -d "=" -f 2)"
          echo "GRADLE_VERSION=$GRADLE_VERSION"
          if [ -z "$GRADLE_VERSION" ]; then
            echo "::error::No VERSION_NAME in gradle.properties"
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "value=$GRADLE_VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GRADLE_VERSION" == *"-SNAPSHOT"* ]]; then
            echo "is-snapshot=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-snapshot=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Git tag matches Gradle version
        if: github.event_name == 'push'
        env:
          GRADLE_VERSION: ${{ steps.version.outputs.value }}
          GIT_TAG: ${{ github.ref_name }}
        run: |
          echo "GIT_TAG=$GIT_TAG"
          if [[ "$GRADLE_VERSION" == *"-SNAPSHOT"* ]]; then
            echo "::error::Can't release a snapshot ($GRADLE_VERSION), tagged as $GIT_TAG"
            exit 1
          elif [ "$GRADLE_VERSION" != "$GIT_TAG" ]; then
            echo "::error::Gradle version = $GRADLE_VERSION, Git tag = $GIT_TAG => MISMATCH!"
            exit 1
          fi

      - name: Report nothing to publish
        if: ${{ github.event_name != 'push' && steps.version.outputs.is-snapshot == 'false' }}
        env:
          GRADLE_VERSION: ${{ steps.version.outputs.value }}
        run: echo "::notice::$GRADLE_VERSION is not a snapshot, nothing to publish. Push a tag to release it."

  publish-snapshot:
    # macOS: the runtime's Apple targets can only be compiled on a macOS host
    runs-on: macos-latest
    timeout-minutes: 60
    needs: check-version
    if: ${{ github.event_name == 'workflow_run' && needs.check-version.outputs.is-snapshot == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check-version.outputs.sha }}
      - uses: ./.github/actions/setup-java
      - uses: ./.github/actions/setup-gradle

      - name: Publish snapshot
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_KEY_PASSWORD }}
        run: ./gradlew publishToMavenCentral

  publish-release:
    # macOS: the runtime's Apple targets can only be compiled on a macOS host
    runs-on: macos-latest
    timeout-minutes: 60
    needs: check-version
    if: ${{ github.event_name == 'push' && needs.check-version.outputs.is-snapshot == 'false' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-java
      - uses: ./.github/actions/setup-gradle

      - name: Publish
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_KEY_PASSWORD }}
        run: ./gradlew publishToMavenCentral

      - name: Create release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          generateReleaseNotes: true
          name: v${{ needs.check-version.outputs.version }}

name: CI

on:
  pull_request:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  CI: true
  GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: read
  pull-requests: write
  security-events: write

concurrency:
  group: 'ci-${{ github.event.merge_group.head_ref || github.head_ref || github.ref }}-${{ github.workflow }}'
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changed-files:
    # paths-filter only supports pull_request and push-to-a-branch events
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      renovate: ${{ steps.filter.outputs.renovate }}
      wrapper: ${{ steps.filter.outputs.wrapper }}
      shell: ${{ steps.filter.outputs.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            renovate:
              - '.github/renovate.json'
              - '.github/renovate.json5'
              - 'renovate.json'
              - 'renovate.json5'
            wrapper:
              - 'gradle/wrapper/**'
              - 'gradlew'
              - 'gradlew.bat'
            shell:
              - '**/*.sh'

  validate-renovate:
    needs: changed-files
    if: needs.changed-files.outputs.renovate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 'lts/*'
      - run: npm install -g renovate
      - run: renovate-config-validator

  validate-wrapper:
    needs: changed-files
    if: needs.changed-files.outputs.wrapper == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

  shellcheck:
    needs: changed-files
    if: needs.changed-files.outputs.shell == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck scripts/*.sh scripts/lib/*.sh

  betterleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dortort/betterleaks-action@cd0b905aa4befb8f42f8b1ab98150180c9e77515 # v0.1.0
        id: betterleaks
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          config: ./config/betterleaks.toml
          fail-on-leak: 'true'
      - uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        if: always()
        with:
          sarif_file: ${{ steps.betterleaks.outputs.sarif-path }}

  ktfmt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-java
      - run: scripts/ktfmt.sh check --force

  validation:
    needs: [ changed-files, validate-wrapper, validate-renovate, shellcheck, betterleaks, ktfmt ]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more validation jobs failed or were cancelled"
            exit 1
          fi

  tests:
    needs: validation
    if: ${{ !cancelled() && needs.validation.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-java
      - uses: ./.github/actions/setup-gradle
      - run: ./gradlew testAll
      - uses: ./.github/actions/report-build-results
        if: ${{ !cancelled() }}

  detekt:
    needs: validation
    if: ${{ !cancelled() && needs.validation.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-java
      - uses: ./.github/actions/setup-gradle
      - run: ./gradlew detektCheck
      - uses: ./.github/actions/report-build-results
        if: ${{ !cancelled() }}

  other-checks:
    needs: validation
    if: ${{ !cancelled() && needs.validation.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-java
      - uses: ./.github/actions/setup-gradle
      - name: Check generated compiler test suites are up to date
        run: |
          ./gradlew :compiler-tests:generateTests
          if ! git diff --exit-code -- compiler-tests/src/test/java; then
            echo "::error::generateTests produced changes. Run './gradlew :compiler-tests:generateTests' locally and commit the results."
            exit 1
          fi
      - run: ./gradlew check -PotherChecks
      - uses: ./.github/actions/report-build-results
        if: ${{ !cancelled() }}

  build-logic:
    needs: validation
    if: ${{ !cancelled() && needs.validation.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-java
      - uses: ./.github/actions/setup-gradle
      - run: ./gradlew -p build-logic check
      - uses: ./.github/actions/report-build-results
        if: ${{ !cancelled() }}

  kotlin-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      versions: ${{ steps.read.outputs.versions }}
      prerelease: ${{ steps.read.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: read
        run: |
          versions=$(sed -n 's/^KOTLIN_VERSIONS=//p' gradle.properties)
          prerelease=$(sed -n 's/^KOTLIN_PRERELEASE=//p' gradle.properties)
          echo "versions=$(jq -Rc 'split(",")' <<< "$versions")" >> "$GITHUB_OUTPUT"
          # Skipped once the pre-release is a supported version
          if [[ ",$versions," != *",$prerelease,"* ]]; then
            echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          fi

  compiler-compat:
    name: compiler-tests (Kotlin ${{ matrix.kotlin }})
    needs: [ validation, kotlin-versions ]
    if: ${{ !cancelled() && needs.validation.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        kotlin: ${{ fromJson(needs.kotlin-versions.outputs.versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-java
      - uses: ./.github/actions/setup-gradle
      - run: ./gradlew :compiler-tests:test -Pfallback.testKotlinVersion=${{ matrix.kotlin }}
      - uses: ./.github/actions/report-build-results
        if: ${{ !cancelled() }}

  sample:
    name: sample (Kotlin ${{ matrix.kotlin }})
    needs: [ validation, kotlin-versions ]
    if: ${{ !cancelled() && needs.validation.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        kotlin: ${{ fromJson(needs.kotlin-versions.outputs.versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-java
      - uses: ./.github/actions/setup-gradle
      - run: ./gradlew -p sample check -Pfallback.testKotlinVersion=${{ matrix.kotlin }}
      - uses: ./.github/actions/report-build-results
        if: ${{ !cancelled() }}

  publish-local:
    needs: validation
    if: ${{ !cancelled() && needs.validation.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_IN_MEMORY_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-java
      - uses: ./.github/actions/setup-gradle
      - run: ./gradlew checkSigningConfiguration
      - run: ./gradlew publishToMavenLocal

  # Early warning for the next Kotlin release. Pre-releases may break internal compiler APIs, so
  # this doesn't block PRs.
  kotlin-prerelease:
    name: ${{ matrix.name }} (Kotlin ${{ needs.kotlin-versions.outputs.prerelease }})
    needs: [ validation, kotlin-versions ]
    if: ${{ !cancelled() && needs.validation.result == 'success' && needs.kotlin-versions.outputs.prerelease != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: compiler-tests
            command: ./gradlew :compiler-tests:test
          - name: sample
            command: ./gradlew -p sample check -Pfallback.skipKotlinVersionCheck=true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-java
      - uses: ./.github/actions/setup-gradle
      - run: ${{ matrix.command }} -Pfallback.testKotlinVersion=${{ needs.kotlin-versions.outputs.prerelease }}
      - uses: ./.github/actions/report-build-results
        if: ${{ !cancelled() }}

  finish:
    if: ${{ !cancelled() }}
    needs:
      - validation
      - tests
      - detekt
      - other-checks
      - build-logic
      - publish-local
      - kotlin-versions
      - compiler-compat
      - sample
      - claude-review
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more jobs failed or were cancelled"
            exit 1
          fi

  claude-review:
    needs: validation
    if: ${{ !cancelled() && needs.validation.result == 'success' && github.event_name == 'pull_request' && !startsWith(github.head_ref, 'renovate/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # finish waits for the review, but a failed review (e.g. usage limits) shouldn't block it
      - uses: anthropics/claude-code-action@3b8197d3d486006dd4af54613517f21ac6ac625e # v1.0.227
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: 'renovate'
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            **Code Review**:
            Use `gh pr diff $PR_NUMBER` to get the diff, then submit a review with inline comments on specific lines where you find:
            - Potential bugs or issues
            - Performance concerns
            - Security concerns
            - Missing test coverage

            Submit a review using:
               gh api repos/$REPO/pulls/$PR_NUMBER/reviews -f event=COMMENT -f body="Review summary" -f 'comments[][path]=file.kt' -f 'comments[][line]=42' -f 'comments[][body]=Your comment'

            Keep comments brief and actionable.

            *IMPORTANT* Only leave a comment if something should be addressed — don't leave praise or nitpicks. To clarify: if you have nothing to say besides "LGTM", **DO NOT LEAVE A COMMENT AT ALL**

            Use the repository's CLAUDE.md for guidance on style and conventions.
          claude_args: '--allowed-tools "Bash(gh api:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)"'

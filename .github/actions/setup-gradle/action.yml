name: Setup Gradle
description: Set up Gradle with caching and encryption, and copy .github/gradle.properties into ~/.gradle

runs:
  using: composite
  steps:
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      with:
        add-job-summary: on-failure
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}
        cache-encryption-key: ${{ env.GRADLE_ENCRYPTION_KEY }}

    - name: Setup gradle.properties
      shell: bash
      run: |
        mkdir -p ~/.gradle
        cp .github/gradle.properties ~/.gradle/gradle.properties

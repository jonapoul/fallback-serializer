name: Setup Gradle
description: Set up Gradle with caching and encryption, and copy .github/gradle.properties into ~/.gradle

runs:
  using: composite
  steps:
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        add-job-summary: on-failure
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}
        cache-encryption-key: ${{ env.GRADLE_ENCRYPTION_KEY }}

    - name: Setup gradle.properties
      shell: bash
      run: |
        mkdir -p ~/.gradle
        cp .github/gradle.properties ~/.gradle/gradle.properties

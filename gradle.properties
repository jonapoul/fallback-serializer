kotlin.code.style=official
kotlin.native.ignoreDisabledTargets=true
kotlin.stdlib.default.dependency=false

org.gradle.caching=true
org.gradle.configuration-cache.parallel=true
org.gradle.configuration-cache.problems=fail
org.gradle.configuration-cache=true
org.gradle.console=colored
org.gradle.daemon=true
# Off until KGP supports isolated projects for JS and Wasm targets: https://youtrack.jetbrains.com/issue/KT-80311
#org.gradle.isolated-projects=true
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.tooling.parallel=true
org.gradle.welcome=never

# Kotlin versions that CI tests and the Gradle plugin accepts. Must include `kotlin` from
# libs.versions.toml.
KOTLIN_VERSIONS=2.4.0,2.4.10,2.4.20

# Latest Kotlin Beta or RC, bumped by Renovate. CI tests it without blocking PRs, and skips it when
# it's already in KOTLIN_VERSIONS.
KOTLIN_PRERELEASE=2.4.20

# Shared by the compiler plugin and the Gradle plugin
PLUGIN_ID=dev.jonpoulton.fallbackserializer

GROUP=dev.jonpoulton.fallbackserializer
VERSION_NAME=0.3.0-SNAPSHOT

POM_DESCRIPTION=Kotlin compiler plugin generating kotlinx.serialization enum serializers with a fallback entry
POM_DEVELOPER_ID=jonapoul
POM_DEVELOPER_NAME=Jon Poulton
POM_DEVELOPER_URL=https://github.com/jonapoul/
POM_INCEPTION_YEAR=2026
POM_LICENSE_DIST=repo
POM_LICENSE_NAME=The Apache Software License, Version 2.0
POM_LICENSE_URL=https://www.apache.org/licenses/LICENSE-2.0.txt
POM_SCM_CONNECTION=scm:git:git://github.com/jonapoul/fallback-serializer.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/jonapoul/fallback-serializer.git
POM_SCM_URL=https://github.com/jonapoul/fallback-serializer
POM_URL=https://github.com/jonapoul/fallback-serializer
RELEASE_SIGNING_ENABLED=true
SONATYPE_AUTOMATIC_RELEASE=true
SONATYPE_HOST=CENTRAL_PORTAL
